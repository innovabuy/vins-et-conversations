version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vc-postgres
    restart: always
    environment:
      POSTGRES_DB: vins_conversations
      POSTGRES_USER: vc_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vc_dev_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vc_admin -d vins_conversations"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vc-redis
    restart: always
    command: redis-server --appendonly yes --replica-read-only no --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: vc-api
    restart: always
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgres://vc_admin:${DB_PASSWORD:-vc_dev_2026}@postgres:5432/vins_conversations
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-vc_jwt_secret_dev_change_in_prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-vc_refresh_secret_dev_change_in_prod}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-AZ_E-ZvSOo4A0fSMJBoZj-JPJf-Wyp_s09XDDM1hoQQFeEvMOcQF8kvNtodxsBq-j57iKEwGgXxrO1TJ}
      PAYPAL_SECRET: ${PAYPAL_SECRET:-EGkCKiJalmy8mxDnMcwWCDqxtszWGEb-9hK_T3KwfCTcqFPzAowyzljbTg8-_iR5-NWx0hAvFL_ZkKgb}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      SITE_PUBLIC_URL: ${SITE_PUBLIC_URL:-http://76.13.44.13:8082}
      FRONTEND_URL: ${FRONTEND_URL:-http://76.13.44.13:5173}
      BASE_URL: ${BASE_URL:-http://76.13.44.13:5173}
      # ─── SMTP (Resend) — valeurs depuis .env hôte, hors git. Token jamais en clair. ───
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_MODE: ${SMTP_MODE}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    ports:
      - "3001:3001"
    # Image figée : plus de volume source (code baked-in). uploads reste monté (DONNÉES).
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # command retiré → CMD figé de l'image (node src/index.js), plus de nodemon.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vc-frontend
    restart: always
    environment:
      VITE_API_URL: ${API_URL:-http://76.13.44.13:3001/api/v1}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/vite.config.js:/app/vite.config.js
    depends_on:
      - api
    command: npm run dev -- --host

  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: vc-frontend-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "8083:80"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api

  site-public:
    image: nginx:alpine
    container_name: vc-site-public
    restart: unless-stopped
    volumes:
      - ./site-public:/usr/share/nginx/html:ro
      - ./nginx/site-public.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8082:80"
    depends_on:
      - api

volumes:
  pgdata:
