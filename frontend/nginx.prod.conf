server {
    listen 80;
    server_name vinsetconversations.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name vinsetconversations.com;
    ssl_certificate     /etc/letsencrypt/live/vinsetconversations.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vinsetconversations.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    root /usr/share/nginx/html;
    index index.html;
    # Uploads images produits : multer accepte 5 Mo, mais le défaut nginx (1 Mo) rejetait en 413
    # avant l'API (repro confirmée). 6m = 5 Mo + marge overhead multipart.
    client_max_body_size 6m;
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;
    }
    location / { try_files $uri $uri/ /index.html; }
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
}
