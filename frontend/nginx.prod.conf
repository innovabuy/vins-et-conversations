server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache agressif sur les assets hashés du build Vite
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API → backend (service docker `api`, résolution DNS interne du réseau)
    # proxy_pass sans slash de fin => l'URI complet /api/v1/... est transmis tel quel.
    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy uploads (images produits / photos ambassadeurs servies par l'API)
    location /uploads/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Pages HTML — pas de cache navigateur
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA fallback — routing react-router côté client (refresh /boutique/... => index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Durcissement léger + compression
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
}
